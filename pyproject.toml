[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threatcatalog"
version = "0.1.0"
description = "Catalog-driven, gap-based threat modeling engine (inspired by STRIDE-GPT)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "PyYAML>=6.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.39"]
openai = ["openai>=1.30"]
bedrock = ["boto3>=1.35"]
sad = ["python-docx>=1.1", "pymupdf>=1.24", "Pillow>=10.0"]
app = ["streamlit>=1.67", "python-docx>=1.1"]
pdf = ["reportlab>=4.0"]
dev = ["pytest>=7.4", "reportlab>=4.0", "python-docx>=1.1", "pymupdf>=1.24", "Pillow>=10.0"]

[project.scripts]
threatcatalog = "threatcatalog.cli:main"

[tool.setuptools.packages.find]
include = ["threatcatalog*"]

[tool.setuptools.package-data]
"threatcatalog.catalog" = ["data/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
