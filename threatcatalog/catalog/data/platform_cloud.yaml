# Cloud layer — cloud-hosted workloads (VPC, IAM, KMS, config).
- id: CLD-SEG-001
  title: Network segmentation / VPC boundaries
  intent: Workloads are segmented so a compromise does not flatten the network.
  guidance: Cloud workloads should be split across network boundaries (VPCs, subnets, security zones)
    so that compromising one component doesn't give an attacker a flat, open path to everything else.
  layers:
  - platform.cloud
  stride:
  - ElevationOfPrivilege
  - InformationDisclosure
  assessment_signal: Are workloads segmented across VPC/subnet boundaries with controlled flows?
  pci:
  - requirement: 1.4.1
  detect_keywords:
  - vpc
  - segmentation
  - private subnet
  - network isolation
  threat_frameworks:
  - framework: cis_v8
    ref: Control 12
    version: '8.1'
- id: CLD-KMS-001
  title: Managed key management (KMS)
  intent: Encryption keys are managed and rotated through a KMS.
  guidance: Encryption keys should be created, stored, and rotated through a managed Key Management Service
    rather than living in config or code. The KMS controls who can use a key and leaves an audit trail.
  layers:
  - platform.cloud
  stride:
  - InformationDisclosure
  assessment_signal: Are encryption keys managed/rotated via a KMS?
  pci:
  - requirement: 3.6.1
  detect_keywords:
  - kms
  - key management service
  - key rotation
  threat_frameworks:
  - framework: cis_v8
    ref: Control 3
    version: '8.1'
- id: CLD-IAM-001
  title: Cloud IAM roles (least privilege)
  intent: Cloud compute uses scoped instance/service roles, not long-lived broad keys.
  guidance: Cloud compute (instances, functions, containers) should assume short-lived, scoped IAM roles
    rather than carrying long-lived static access keys. Static keys leak and rarely get rotated.
  layers:
  - platform.cloud
  stride:
  - ElevationOfPrivilege
  assessment_signal: Do cloud workloads use scoped IAM roles rather than broad static credentials?
  pci:
  - requirement: 7.2.1
  detect_keywords:
  - iam role
  - instance role
  - service role
  - assume role
  threat_frameworks:
  - framework: cis_v8
    ref: Control 6
    version: '8.1'
- id: CLD-SG-001
  title: Restrictive security groups
  intent: Inbound/outbound rules are least-exposure by default.
  guidance: Security groups / firewall rules should deny by default and open only what's needed. 'Allow
    0.0.0.0/0 on all ports' is the classic finding here.
  layers:
  - platform.cloud
  stride:
  - ElevationOfPrivilege
  assessment_signal: Are security-group/firewall rules restrictive (deny by default)?
  pci:
  - requirement: 1.3.1
  detect_keywords:
  - security group
  - ingress rules
  - nacl
  - firewall rules
  threat_frameworks:
  - framework: cis_v8
    ref: Control 12
    version: '8.1'
- id: IMMUT-001
  title: Immutable infrastructure and configuration drift management
  intent: Hosts are deployed from versioned images and replaced rather than modified in place; infrastructure
    and security configuration is version-controlled, reviewed and monitored for drift.
  guidance: Instead of logging in to patch a running server (which causes 'works-on-that-box' drift and
    hides tampering), rebuild from a versioned, hardened image and replace it. Immutable, infrastructure-as-code
    deployments make configuration auditable and tampering obvious. Keep infrastructure and security
    configuration as reviewed code, and run drift detection so any out-of-band change is flagged and reverted.
  layers:
  - platform.cloud
  - platform.onprem
  stride:
  - Tampering
  default_expectation: recommended
  assessment_signal: Are hosts deployed from versioned images and replaced (not patched in place), with
    configuration as reviewed code and drift detection in place?
  notes: Absorbs the proposed CFG-DRIFT-001 (secure configuration and drift management). See also CLD-CSPM-001.
  threat_frameworks:
  - framework: cis_v8
    ref: Control 4
    version: '8.1'
  pci:
  - requirement: 2.2.1
  detect_keywords:
  - immutable infrastructure
  - golden image
  - infrastructure as code
  - rebuild not patch
  - no drift
  - drift detection
  - terraform
- id: CLD-CSPM-001
  title: Cloud posture management and guardrails
  intent: Organisation-level guardrails block risky configurations, and posture management detects drift from
    them.
  guidance: One click can make a bucket public. Organisation policies (SCPs, Azure Policy, GCP org policies)
    should block the riskiest misconfigurations outright, and a posture management tool should continuously
    flag anything that drifts from the baseline.
  layers:
  - platform.cloud
  stride:
  - InformationDisclosure
  - ElevationOfPrivilege
  assessment_signal: Do org-level policies block risky cloud configurations, with posture management detecting
    drift?
  threat_frameworks:
  - framework: cis_v8
    ref: Control 4
    version: '8.1'
  pci:
  - requirement: 2.2.1
  detect_keywords:
  - cspm
  - service control policy
  - azure policy
  - org policy
  - security hub
  notes: 'See also: IMMUT-001, CLD-SG-001.'
- id: CLD-LOG-001
  title: Cloud control-plane audit logging
  intent: Cloud control-plane activity is logged, protected from tampering and sent to the central SIEM.
  guidance: Application logs do not show who changed an IAM policy or deleted a database. Enable the provider's
    control-plane logs (CloudTrail, Azure Activity Log, GCP Audit Logs) in every account and region, protect
    them from deletion and forward them to the SIEM.
  layers:
  - platform.cloud
  stride:
  - Repudiation
  assessment_signal: Are cloud control-plane logs enabled everywhere, tamper-protected and sent to the SIEM?
  threat_frameworks:
  - framework: cis_v8
    ref: Control 8
    version: '8.1'
  pci:
  - requirement: 10.2.1
  detect_keywords:
  - cloudtrail
  - activity log
  - cloud audit logs
  notes: 'See also: LOG-AUD-001, LOG-CORR-001.'
- id: CLD-PE-001
  title: Private endpoints for managed services
  intent: Databases, storage, queues and secrets stores are reached over private endpoints with public access
    disabled.
  guidance: Managed cloud services often have a public endpoint by default, protected only by credentials.
    Use private endpoints or service endpoints so traffic stays on the private network, and disable public
    access.
  layers:
  - platform.cloud
  stride:
  - InformationDisclosure
  assessment_signal: Are managed data services reached via private endpoints with public network access disabled?
  threat_frameworks:
  - framework: cis_v8
    ref: Control 12
    version: '8.1'
  pci:
  - requirement: 1.3.1
  detect_keywords:
  - private endpoint
  - privatelink
  - private link
  - vpc endpoint
  - private service connect
  notes: 'See also: CLD-SEG-001.'
